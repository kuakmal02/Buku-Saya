<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buku Saya</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3A5F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5;--surface:#FFFFFF;--ink:#16202E;--mute:#5B6778;--line:#DCE2EA;
  --brand:#1F3A5F;--onbrand:#FFFFFF;--accent:#0E7C86;--danger:#B42318;--ok:#1B7F4B;--track:#E3E8EF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E141C;--surface:#161F2B;--ink:#E6EBF2;--mute:#98A4B5;--line:#263243;
    --brand:#5B8DD6;--onbrand:#0E141C;--accent:#4FB3BD;--danger:#F0877D;--ok:#5CC48C;--track:#263243;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141C;--surface:#161F2B;--ink:#E6EBF2;--mute:#98A4B5;--line:#263243;
  --brand:#5B8DD6;--onbrand:#0E141C;--accent:#4FB3BD;--danger:#F0877D;--ok:#5CC48C;--track:#263243;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 96px}
header{padding:22px 0 8px}
h1{margin:0 0 14px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat small{display:block;color:var(--mute);font-size:12px}
.stat b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
h2{font-size:17px;margin:20px 0 10px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:3px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent;min-height:42px;padding:0 16px}
.primary{background:var(--brand);color:var(--onbrand);font-weight:600;width:100%;margin-top:12px}
.ghost{background:transparent;color:var(--mute);border-color:var(--line);min-height:34px;padding:0 10px;font-size:13px}
.ghost.sure{color:var(--danger);border-color:var(--danger)}
.pay{background:var(--accent);color:var(--onbrand);font-weight:600;min-height:38px}
.list{display:grid;gap:8px;margin-top:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.t{font-weight:600}
.m{color:var(--mute);font-size:13px}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin-left:6px;font-weight:500}
.bar{height:6px;background:var(--track);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--accent)}
.payrow{display:flex;gap:8px;margin-top:10px}
.payrow input{flex:1}
textarea{width:100%;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:90px}
.empty{color:var(--mute);text-align:center;padding:24px 8px;border:1px dashed var(--line);border-radius:12px}
.todo{display:flex;align-items:center;gap:12px}
.todo input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.todo .tx{flex:1}
.done .tx{text-decoration:line-through;color:var(--mute)}
.neg{color:var(--danger)}.pos{color:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;border-radius:0;min-height:54px;color:var(--mute);font-weight:500;border-top:3px solid transparent}
nav button[aria-selected="true"]{color:var(--brand);border-top-color:var(--brand);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button[aria-selected="true"]{color:var(--ink)}}
@media (max-width:420px){.stats{gap:6px}.stat{padding:8px}.stat b{font-size:14px}}
.auth{max-width:420px;margin:0 auto;padding:40px 16px}
[hidden]{display:none!important}
.links{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:14px}
.link{background:none;border:0;color:var(--accent);min-height:34px;padding:0;text-decoration:underline;font-size:13.5px}
.msg{font-size:13px;margin-top:10px;min-height:1px}
.err{color:var(--danger)}
.warn{color:#B45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{color:#F2B15C}}
:root[data-theme="dark"] .warn{color:#F2B15C}
.alert{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--danger);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.alert div{margin-top:2px}
</style>
</head>
<body>
<div id="auth" class="auth"><div class="empty">Memuatkan...</div></div>
<div class="wrap" id="app" hidden>
  <header>
    <div class="row" style="align-items:center;margin-bottom:14px"><h1 style="margin:0">Buku Saya</h1><div class="m" style="text-align:right"><div id="who"></div><div id="sync"></div></div></div>
    <div class="stats" id="stats"></div>
  </header>
  <main id="main"></main>
</div>
<nav id="nav" role="tablist" hidden></nav>

<script>
var S={service:[],debt:[],spend:[],todo:[],motors:[]},tab='service';
function save(){if(window.cloudSave)window.cloudSave(S)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rm(n){return 'RM '+(Number(n)||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fd(s){if(!s)return '';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function v(id){var e=document.getElementById(id);return e?e.value.trim():''}
function num(id){return parseFloat(v(id))||0}
var TABS=[['service','Servis'],['debt','Hutang'],['spend','Belanja'],['todo','Tugasan']];
var CATS=['Makan','Minyak','Pengangkutan','Bil','Kediaman','Lain-lain'];

function paid(d){return (d.pays||[]).reduce(function(a,p){return a+p},0)}
function bal(d){return Math.max(0,d.amt-paid(d))}

function stats(){
  var ym=today().slice(0,7);
  var sp=S.spend.filter(function(x){return x.date.slice(0,7)===ym}).reduce(function(a,x){return a+x.amt},0);
  var owe=S.debt.filter(function(d){return d.dir==='owe'}).reduce(function(a,d){return a+bal(d)},0);
  var td=S.todo.filter(function(t){return !t.done}).length;
  document.getElementById('stats').innerHTML=
    '<div class="stat"><small>Belanja bulan ini</small><b>'+rm(sp)+'</b></div>'+
    '<div class="stat"><small>Hutang saya</small><b>'+rm(owe)+'</b></div>'+
    '<div class="stat"><small>Tugasan tinggal</small><b>'+td+'</b></div>';
}

function nav(){
  document.getElementById('nav').innerHTML=TABS.map(function(t){
    return '<button role="tab" aria-selected="'+(t[0]===tab)+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
}
function go(t){tab=t;render()}

function delBtn(type,id){return '<button class="ghost" onclick="del(\''+type+'\',\''+id+'\',this)">Padam</button>'}
function del(type,id,b){
  if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='Pasti padam?';
    setTimeout(function(){if(b.isConnected){b.classList.remove('sure');b.textContent='Padam'}},3000);return}
  S[type]=S[type].filter(function(x){return x.id!==id});save();render();
}
function empty(t){return '<div class="empty">'+t+'</div>'}

var curMotor='',editingMotor='';
function daysTo(d){return Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5)}
function motorName(id){var m=S.motors.filter(function(x){return x.id===id})[0];return m?m.name:'-'}
function norm(){
  var ch=false;
  if(!Array.isArray(S.motors)){S.motors=[];ch=true}
  if(S.service.some(function(x){return !x.motor})&&!S.motors.length){S.motors.push({id:uid(),name:'Motosikal saya',plate:''});ch=true}
  S.service.forEach(function(x){if(!x.motor){x.motor=S.motors[0].id;ch=true}});
  if(!S.motors.some(function(m){return m.id===curMotor}))curMotor=S.motors[0]?S.motors[0].id:'';
  return ch;
}
function svStatus(m){
  var l=S.service.filter(function(x){return x.motor===m.id}).sort(function(a,b){return b.date.localeCompare(a.date)});
  var mk=Math.max.apply(null,[0].concat(l.map(function(x){return x.km||0})));
  var rk=l.filter(function(x){return x.next})[0],rd=l.filter(function(x){return x.nextDate})[0];
  var r={m:m,mk:mk,nextKm:rk?rk.next:null,nextDate:rd?rd.nextDate:null,left:null,days:null,level:'none'};
  if(rk)r.left=rk.next-mk;
  if(rd)r.days=daysTo(rd.nextDate);
  if(rk||rd){
    if((r.left!==null&&r.left<=0)||(r.days!==null&&r.days<=0))r.level='over';
    else if((r.left!==null&&r.left<=500)||(r.days!==null&&r.days<=14))r.level='soon';
    else r.level='ok';
  }
  return r;
}
function svText(r){
  var p=[];
  if(r.left!==null)p.push(r.left>0?'baki '+r.left.toLocaleString('en-MY')+' km':'sudah melepasi '+r.nextKm.toLocaleString('en-MY')+' km');
  if(r.days!==null)p.push(r.days>0?r.days+' hari lagi':(r.days===0?'servis hari ini':'lewat '+(-r.days)+' hari'));
  return p.join(', ');
}
function alertBar(){
  var r=S.motors.map(svStatus).filter(function(x){return x.level==='over'||x.level==='soon'});
  if(!r.length)return '';
  return '<div class="alert"><b>Peringatan servis</b>'+r.map(function(x){return '<div class="'+(x.level==='over'?'neg':'warn')+'">'+esc(x.m.name)+': '+svText(x)+'</div>'}).join('')+'</div>';
}
function motorForm(){
  return '<div class="grid" style="margin-top:12px"><div><label for="mo-name">Nama motosikal</label><input id="mo-name" placeholder="Yamaha LC135"></div><div><label for="mo-plate">No. pendaftaran</label><input id="mo-plate" placeholder="ABC 1234"></div></div><button class="primary" onclick="addMotor()">Simpan motosikal</button>';
}
function pickMotor(id){curMotor=id;editingMotor='';render()}
function toggleMotorForm(edit){
  var m=S.motors.filter(function(x){return x.id===curMotor})[0];
  editingMotor=edit&&m?m.id:'';
  document.getElementById('mo-name').value=editingMotor?m.name:'';
  document.getElementById('mo-plate').value=editingMotor?m.plate:'';
  document.getElementById('mo-form').hidden=false;document.getElementById('mo-name').focus();
}
function addMotor(){
  var n=v('mo-name');if(!n){document.getElementById('mo-name').focus();return}
  var pl=v('mo-plate').toUpperCase();
  if(editingMotor){S.motors.forEach(function(x){if(x.id===editingMotor){x.name=n;x.plate=pl}})}
  else{var id=uid();S.motors.push({id:id,name:n,plate:pl});curMotor=id}
  editingMotor='';save();render();
}
function delMotor(b){
  if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='Pasti? Rekod servisnya turut dipadam';
    setTimeout(function(){if(b.isConnected){b.classList.remove('sure');b.textContent='Padam motosikal ini'}},4000);return}
  var id=curMotor;
  S.motors=S.motors.filter(function(x){return x.id!==id});
  S.service=S.service.filter(function(x){return x.motor!==id});
  save();render();
}
function vService(){
  if(!S.motors.length)return '<h2>Tambah motosikal pertama</h2><div class="panel">'+motorForm()+'</div>';
  var m=S.motors.filter(function(x){return x.id===curMotor})[0]||S.motors[0];
  var l=S.service.filter(function(x){return x.motor===m.id}).sort(function(a,b){return b.date.localeCompare(a.date)});
  var yr=today().slice(0,4);
  var cost=l.filter(function(x){return x.date.slice(0,4)===yr}).reduce(function(a,x){return a+x.cost},0);
  var st=svStatus(m),last=l[0];
  var h='<h2>Motosikal</h2><div class="panel"><label for="mo-sel">Pilih motosikal</label><select id="mo-sel" onchange="pickMotor(this.value)">'+
   S.motors.map(function(x){return '<option value="'+x.id+'"'+(x.id===m.id?' selected':'')+'>'+esc(x.name)+(x.plate?' ('+esc(x.plate)+')':'')+'</option>'}).join('')+'</select>'+
   '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="ghost" onclick="toggleMotorForm(false)">Tambah motosikal</button><button class="ghost" onclick="toggleMotorForm(true)">Ubah nama</button><button class="ghost" onclick="delMotor(this)">Padam motosikal ini</button></div>'+
   '<div id="mo-form" hidden>'+motorForm()+'</div></div>';
  h+='<h2>Status servis</h2><div class="item">';
  if(st.level==='none')h+='<div class="m">Belum ada tarikh atau km servis seterusnya. Isi semasa merekod servis.</div>';
  else h+='<div class="t '+(st.level==='over'?'neg':(st.level==='soon'?'warn':'pos'))+'">'+(st.level==='over'?'Sudah tiba masa servis':(st.level==='soon'?'Servis hampir tiba':'Servis dalam keadaan baik'))+'</div><div class="m">'+svText(st)+(st.mk?'. Bacaan terakhir '+st.mk.toLocaleString('en-MY')+' km.':'.')+'</div>';
  h+='</div>';
  h+='<h2>Rekod servis baharu</h2><div class="panel"><div class="grid">'+
   '<div><label for="sv-date">Tarikh</label><input id="sv-date" type="date" value="'+today()+'"></div>'+
   '<div><label for="sv-km">Bacaan odometer (km)</label><input id="sv-km" type="number" inputmode="numeric" placeholder="12500"></div>'+
   '<div class="full"><label for="sv-work">Kerja servis</label><input id="sv-work" placeholder="Tukar minyak enjin, pad brek"></div>'+
   '<div><label for="sv-cost">Kos (RM)</label><input id="sv-cost" type="number" inputmode="decimal" placeholder="0.00"></div>'+
   '<div><label for="sv-resit">No. resit</label><input id="sv-resit" placeholder="INV-0123"></div>'+
   '<div class="full"><label for="sv-note">Nota / kedai</label><input id="sv-note" placeholder="Bengkel Ali"></div>'+
   '<div><label for="sv-next">Servis seterusnya (km)</label><input id="sv-next" type="number" inputmode="numeric" placeholder="15000"></div>'+
   '<div><label for="sv-nextdate">Servis seterusnya (tarikh)</label><input id="sv-nextdate" type="date"></div>'+
   '</div><button class="primary" onclick="addService()">Simpan servis</button></div>';
  h+='<h2>Sejarah servis</h2>';
  if(last)h+='<div class="m">Terakhir: '+fd(last.date)+(last.km?' pada '+Number(last.km).toLocaleString('en-MY')+' km':'')+'. Kos servis tahun ini: '+rm(cost)+'.</div>';
  h+='<div class="list">'+(l.length?l.map(function(x){
    return '<div class="item"><div class="row"><div><div class="t">'+esc(x.work)+'</div><div class="m">'+fd(x.date)+(x.km?' · '+Number(x.km).toLocaleString('en-MY')+' km':'')+(x.resit?' · Resit '+esc(x.resit):'')+'</div></div><div class="amt">'+rm(x.cost)+'</div></div>'+
      (x.note?'<div class="m" style="margin-top:4px">'+esc(x.note)+'</div>':'')+
      ((x.next||x.nextDate)?'<div class="m" style="margin-top:4px">Seterusnya: '+(x.next?Number(x.next).toLocaleString('en-MY')+' km':'')+(x.next&&x.nextDate?' atau ':'')+(x.nextDate?fd(x.nextDate):'')+'</div>':'')+
      '<div style="margin-top:8px">'+delBtn('service',x.id)+'</div></div>'}).join(''):empty('Belum ada rekod servis untuk motosikal ini.'))+'</div>';
  return h;
}
function addService(){
  var w=v('sv-work');if(!w){document.getElementById('sv-work').focus();return}
  S.service.push({id:uid(),motor:curMotor,date:v('sv-date')||today(),km:num('sv-km'),work:w,cost:num('sv-cost'),note:v('sv-note'),resit:v('sv-resit'),next:num('sv-next'),nextDate:v('sv-nextdate')});save();render();
}
function vDebt(){
  var h='<h2>Hutang baharu</h2><div class="panel"><div class="grid">'+
   '<div><label for="d-name">Nama</label><input id="d-name" placeholder="Nama orang / bank"></div>'+
   '<div><label for="d-dir">Jenis</label><select id="d-dir"><option value="owe">Saya berhutang</option><option value="lent">Orang hutang saya</option></select></div>'+
   '<div><label for="d-amt">Jumlah (RM)</label><input id="d-amt" type="number" inputmode="decimal" placeholder="0.00"></div>'+
   '<div><label for="d-note">Nota</label><input id="d-note" placeholder="Pinjaman, sebab"></div>'+
   '</div><button class="primary" onclick="addDebt()">Simpan hutang</button></div>';
  h+='<h2>Senarai hutang</h2><div class="list">'+(S.debt.length?S.debt.map(function(d){
    var p=paid(d),b=bal(d),pc=d.amt?Math.min(100,p/d.amt*100):100;
    return '<div class="item"><div class="row"><div><div class="t">'+esc(d.name)+'<span class="tag">'+(d.dir==='owe'?'Saya berhutang':'Orang hutang saya')+'</span></div>'+(d.note?'<div class="m">'+esc(d.note)+'</div>':'')+'</div>'+
     '<div class="amt '+(b===0?'pos':(d.dir==='owe'?'neg':''))+'">'+(b===0?'Selesai':rm(b))+'</div></div>'+
     '<div class="bar"><i style="width:'+pc+'%"></i></div><div class="m">Dibayar '+rm(p)+' daripada '+rm(d.amt)+'</div>'+
     (b>0?'<div class="payrow"><input id="p-'+d.id+'" type="number" inputmode="decimal" placeholder="Jumlah bayaran" aria-label="Jumlah bayaran"><button class="pay" onclick="payDebt(\''+d.id+'\')">Bayar</button></div>':'')+
     '<div style="margin-top:8px">'+delBtn('debt',d.id)+'</div></div>'}).join(''):empty('Tiada hutang direkodkan.'))+'</div>';
  return h;
}
function addDebt(){
  var n=v('d-name'),a=num('d-amt');if(!n||!a){(n?document.getElementById('d-amt'):document.getElementById('d-name')).focus();return}
  S.debt.push({id:uid(),name:n,dir:v('d-dir'),amt:a,note:v('d-note'),pays:[]});save();render();
}
function payDebt(id){
  var a=num('p-'+id);if(a<=0)return;
  S.debt.forEach(function(d){if(d.id===id){d.pays=(d.pays||[]).concat([Math.min(a,bal(d))])}});save();render();
}

function vSpend(){
  var t=today(),ym=t.slice(0,7);
  var td=S.spend.filter(function(x){return x.date===t}).reduce(function(a,x){return a+x.amt},0);
  var mo=S.spend.filter(function(x){return x.date.slice(0,7)===ym}).reduce(function(a,x){return a+x.amt},0);
  var l=S.spend.slice().sort(function(a,b){return b.date.localeCompare(a.date)});
  var h='<h2>Perbelanjaan baharu</h2><div class="panel"><div class="grid">'+
   '<div><label for="s-date">Tarikh</label><input id="s-date" type="date" value="'+t+'"></div>'+
   '<div><label for="s-cat">Kategori</label><select id="s-cat">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></div>'+
   '<div><label for="s-amt">Jumlah (RM)</label><input id="s-amt" type="number" inputmode="decimal" placeholder="0.00"></div>'+
   '<div><label for="s-note">Nota</label><input id="s-note" placeholder="Nasi lemak, minyak RON95"></div>'+
   '</div><button class="primary" onclick="addSpend()">Simpan belanja</button></div>';
  var cs=CATS.map(function(c){return [c,S.spend.filter(function(x){return x.cat===c&&x.date.slice(0,7)===ym}).reduce(function(a,x){return a+x.amt},0)]}).filter(function(c){return c[1]>0});
  if(cs.length){h+='<h2>Belanja bulan ini mengikut kategori</h2><div class="panel">'+cs.map(function(c){return '<div class="row"><span>'+c[0]+'</span><span class="amt">'+rm(c[1])+'</span></div><div class="bar"><i style="width:'+(c[1]/mo*100)+'%"></i></div>'}).join('')+'</div>'}
  h+='<h2>Rekod belanja</h2><div class="m">Hari ini: '+rm(td)+'. Bulan ini: '+rm(mo)+'.</div><div class="list">'+(l.length?l.map(function(x){
    return '<div class="item"><div class="row"><div><div class="t">'+esc(x.cat)+'</div><div class="m">'+fd(x.date)+(x.note?' · '+esc(x.note):'')+'</div></div><div class="amt">'+rm(x.amt)+'</div></div><div style="margin-top:8px">'+delBtn('spend',x.id)+'</div></div>'}).join(''):empty('Belum ada perbelanjaan. Catat belanja pertama hari ini.'))+'</div>';
  return h;
}
function addSpend(){
  var a=num('s-amt');if(a<=0){document.getElementById('s-amt').focus();return}
  S.spend.push({id:uid(),date:v('s-date')||today(),cat:v('s-cat'),amt:a,note:v('s-note')});save();render();
}

function vTodo(){
  var l=S.todo.slice().sort(function(a,b){return (a.done-b.done)});
  var h='<h2>Tugasan baharu</h2><div class="panel"><div class="payrow" style="margin:0"><input id="t-text" placeholder="Contoh: Bayar cukai jalan" aria-label="Tugasan" onkeydown="if(event.key===\'Enter\')addTodo()"><button class="pay" onclick="addTodo()">Tambah</button></div></div>';
  h+='<h2>Senarai tugasan</h2><div class="list">'+(l.length?l.map(function(t){
    return '<div class="item todo'+(t.done?' done':'')+'"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggle(\''+t.id+'\')" aria-label="Tanda siap"><div class="tx">'+esc(t.text)+'</div>'+delBtn('todo',t.id)+'</div>'}).join(''):empty('Tiada tugasan. Senarai anda kosong.'))+'</div>';
  return h;
}
function addTodo(){var t=v('t-text');if(!t)return;S.todo.push({id:uid(),text:t,done:false});save();render();document.getElementById('t-text').focus()}
function toggle(id){S.todo.forEach(function(t){if(t.id===id)t.done=!t.done});save();render()}

function vBackup(){return '<h2>Sandaran data</h2><div class="panel"><div class="m" style="margin-bottom:8px">Salin data ke tempat selamat. Untuk pulihkan, tampal data sandaran di kotak ini.</div><textarea id="bk" aria-label="Data sandaran"></textarea><div class="grid" style="margin-top:10px"><button class="pay" onclick="bkCopy()">Salin data</button><button class="ghost" style="min-height:38px" onclick="bkRestore(this)">Pulihkan data</button></div><button class="pay" style="width:100%;margin-top:10px" onclick="exportCsv()">Muat turun Excel (CSV): '+tabName()+'</button><div class="m" id="bk-msg" style="margin-top:8px"></div></div>'}
function bkCopy(){var t=JSON.stringify(S),e=document.getElementById('bk'),m=document.getElementById('bk-msg');e.value=t;e.select();var fb=function(){m.textContent='Tekan lama pada kotak untuk salin data.'};try{navigator.clipboard.writeText(t).then(function(){m.textContent='Data disalin. Simpan di Nota atau hantar kepada diri sendiri.'},fb)}catch(x){fb()}}
function bkRestore(b){
  if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='Pasti? Data semasa diganti';setTimeout(function(){if(b.isConnected){b.classList.remove('sure');b.textContent='Pulihkan data'}},4000);return}
  try{var o=JSON.parse(v('bk'));if(!o||!Array.isArray(o.service)||!Array.isArray(o.debt)||!Array.isArray(o.spend)||!Array.isArray(o.todo))throw 0;S=o;norm();save();render()}
  catch(e){document.getElementById('bk-msg').textContent='Data tidak sah. Tampal data sandaran yang lengkap.';b.classList.remove('sure');b.textContent='Pulihkan data'}
}
function render(){
  var y=window.scrollY;norm();
  document.getElementById('main').innerHTML=alertBar()+{service:vService,debt:vDebt,spend:vSpend,todo:vTodo}[tab]()+vBackup()+vAccount();
  nav();stats();window.scrollTo(0,y);
}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}

function tabName(){return {service:'Servis',debt:'Hutang',spend:'Belanja',todo:'Tugasan'}[tab]}
function csvCell(x){x=String(x==null?'':x);if(/^[=+\-@\t\r]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'}
function exportCsv(){
  var head,rows;
  if(tab==='service'){head=['Motosikal','Tarikh','Km','Kerja','Kos (RM)','No. resit','Nota','Servis seterusnya (km)','Servis seterusnya (tarikh)'];rows=S.service.map(function(x){return [motorName(x.motor),x.date,x.km,x.work,x.cost,x.resit||'',x.note,x.next||'',x.nextDate||'']})}
  else if(tab==='debt'){head=['Nama','Jenis','Jumlah (RM)','Dibayar (RM)','Baki (RM)','Nota'];rows=S.debt.map(function(d){return [d.name,d.dir==='owe'?'Saya berhutang':'Orang hutang saya',d.amt,paid(d),bal(d),d.note]})}
  else if(tab==='spend'){head=['Tarikh','Kategori','Jumlah (RM)','Nota'];rows=S.spend.map(function(x){return [x.date,x.cat,x.amt,x.note]})}
  else{head=['Tugasan','Siap'];rows=S.todo.map(function(t){return [t.text,t.done?'Ya':'Tidak']})}
  var csv='\ufeff'+[head].concat(rows).map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='buku-saya-'+tab+'-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove();
}
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,updatePassword,reauthenticateWithCredential,EmailAuthProvider,updateProfile,sendEmailVerification,deleteUser} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

var app=initializeApp({
  apiKey:"AIzaSyDOWpk9NAU90yZIiRJg5kCVVTMsU1YrZ-Q",
  authDomain:"buku-saya-2c17d.firebaseapp.com",
  projectId:"buku-saya-2c17d",
  storageBucket:"buku-saya-2c17d.firebasestorage.app",
  messagingSenderId:"978561023459",
  appId:"1:978561023459:web:ce824acde86d74e334f4d6"
});
var auth=getAuth(app),db=getFirestore(app);
var $=function(id){return document.getElementById(id)};
var KEYS=['service','debt','spend','todo','motors'];
var loaded=false,timer=null;
var ERR={
  'auth/invalid-credential':'E-mel atau kata laluan salah.',
  'auth/wrong-password':'E-mel atau kata laluan salah.',
  'auth/user-not-found':'E-mel atau kata laluan salah.',
  'auth/invalid-email':'Format e-mel tidak sah.',
  'auth/email-already-in-use':'E-mel ini sudah didaftarkan. Cuba log masuk.',
  'auth/weak-password':'Kata laluan terlalu lemah.',
  'auth/too-many-requests':'Terlalu banyak percubaan. Cuba lagi sebentar.',
  'auth/network-request-failed':'Tiada sambungan internet.',
  'auth/requires-recent-login':'Sila log keluar dan log masuk semula, kemudian cuba lagi.'
};
function emsg(e){return ERR[e&&e.code]||'Sesuatu tidak kena. Cuba lagi.'}
function dref(u){return doc(db,'users',u.uid,'data','main')}
function showApp(on){$('auth').hidden=on;$('app').hidden=!on;$('nav').hidden=!on}
function setSync(t,bad){var s=$('sync');if(s){s.textContent=t;s.style.color=bad?'var(--danger)':''}}
function setWho(){var u=auth.currentUser;var w=$('who');if(w)w.textContent=u?(u.displayName||u.email):''}
function note(t,ok){var m=$('a-msg');if(m){m.textContent=t||'';m.className='msg '+(ok?'pos':'err')}}
function field(id,label,type,ac,enter){
  return '<div style="margin-bottom:10px"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" autocomplete="'+ac+'"'+(enter?' onkeydown="if(event.key===\'Enter\')'+enter+'"':'')+'></div>';
}
function back(){return '<button class="ghost" style="width:100%;margin-top:12px" onclick="showAuth(\'login\')">Kembali ke log masuk</button>'}

window.showAuth=function(mode,msg,ok){
  showApp(false);
  var h='<h1 style="margin:0 0 4px">Buku Saya</h1><div class="m" style="margin-bottom:16px">Servis motosikal, hutang, belanja dan tugasan.</div><div class="panel">';
  if(mode==='login'){
    h+='<h2 style="margin-top:0">Log masuk</h2>'+field('a-email','E-mel','email','email')+field('a-pass','Kata laluan','password','current-password',"doAuth('login')")+
      '<button class="primary" onclick="doAuth(\'login\')">Log masuk</button><div id="a-msg" class="msg" role="status"></div>'+
      '<div class="links"><button class="link" onclick="showAuth(\'forgot\')">Lupa kata laluan</button><button class="link" onclick="showAuth(\'lupauser\')">Lupa username</button><button class="link" onclick="showAuth(\'lupaemel\')">Lupa e-mel</button><button class="link" onclick="showAuth(\'privasi\')">Polisi Privasi</button></div>'+
      '<button class="ghost" style="width:100%;margin-top:12px" onclick="showAuth(\'register\')">Daftar akaun baharu</button>';
  }else if(mode==='register'){
    h+='<h2 style="margin-top:0">Daftar akaun</h2>'+field('a-user','Username (3-20 huruf, nombor atau _)','text','username')+field('a-email','E-mel','email','email')+
      field('a-pass','Kata laluan (sekurang-kurangnya 8 aksara)','password','new-password')+field('a-pass2','Ulang kata laluan','password','new-password',"doAuth('register')")+
      '<label style="display:flex;gap:8px;align-items:flex-start;margin:4px 0;color:var(--ink)"><input id="a-ok" type="checkbox" style="width:20px;height:20px;min-height:0;margin-top:2px;accent-color:var(--accent)"><span>Saya setuju dengan Polisi Privasi</span></label><details style="margin-bottom:8px"><summary class="m" style="cursor:pointer">Baca Polisi Privasi</summary>'+policy()+'</details>'+'<button class="primary" onclick="doAuth(\'register\')">Daftar</button><div id="a-msg" class="msg" role="status"></div>'+back();
  }else if(mode==='forgot'){
    h+='<h2 style="margin-top:0">Lupa kata laluan</h2><div class="m" style="margin-bottom:10px">Masukkan e-mel akaun anda. Kami hantar pautan untuk tetapkan kata laluan baharu.</div>'+
      field('a-email','E-mel','email','email',"doAuth('forgot')")+'<button class="primary" onclick="doAuth(\'forgot\')">Hantar pautan</button><div id="a-msg" class="msg" role="status"></div>'+back();
  }else if(mode==='lupauser'){
    h+='<h2 style="margin-top:0">Lupa username</h2><div class="m">Log masuk dengan e-mel dan kata laluan anda. Username dipaparkan di penjuru atas app dan dalam bahagian Akaun. Kalau kata laluan juga terlupa, guna Lupa kata laluan dahulu.</div>'+back();
  }else if(mode==='lupaemel'){
    h+='<h2 style="margin-top:0">Lupa e-mel</h2><div class="m">E-mel tidak boleh dicari semula daripada app ini. Cuba guna Lupa kata laluan dengan setiap e-mel yang biasa anda guna. Pautan hanya sampai jika e-mel itu berdaftar. Jika anda pemilik app, senarai e-mel ada di Firebase Console, bahagian Authentication.</div>'+back();
  }else if(mode==='privasi'){
    h+='<h2 style="margin-top:0">Polisi Privasi</h2>'+policy()+back();
  }else if(mode==='verify'){
    var vu=auth.currentUser;
    h+='<h2 style="margin-top:0">Sahkan e-mel anda</h2><div class="m" style="margin-bottom:12px">Kami telah hantar pautan pengesahan ke <b>'+esc(vu?vu.email:'')+'</b>. Tekan pautan itu, kemudian tekan butang di bawah. Semak folder spam jika tidak jumpa.</div>'+
      '<button class="primary" onclick="doVerified()">Saya dah sahkan</button><button class="ghost" style="width:100%;margin-top:10px" onclick="doResend()">Hantar semula e-mel</button><div id="a-msg" class="msg" role="status"></div>'+
      '<button class="ghost" style="width:100%;margin-top:12px" onclick="doLogout()">Log keluar</button>';
  }else if(mode==='error'){
    h+='<h2 style="margin-top:0">Data gagal dimuatkan</h2><div class="m">Semak sambungan internet. Data anda tidak diubah.</div><button class="primary" onclick="location.reload()">Cuba lagi</button><button class="ghost" style="width:100%;margin-top:12px" onclick="doLogout()">Log keluar</button>';
  }
  $('auth').innerHTML=h+'</div>';
  if(msg)note(msg,ok);
};

window.doAuth=async function(mode){
  var em=v('a-email'),pw=($('a-pass')||{}).value||'';
  try{
    if(mode==='login'){
      if(!em||!pw){note('Isi e-mel dan kata laluan.');return}
      note('Sedang log masuk...',true);
      await signInWithEmailAndPassword(auth,em,pw);
    }else if(mode==='register'){
      var un=v('a-user');
      if(!/^[A-Za-z0-9_]{3,20}$/.test(un)){note('Username mesti 3 hingga 20 aksara: huruf, nombor atau _.');return}
      if(!em){note('Isi e-mel.');return}
      if(pw.length<8){note('Kata laluan mesti sekurang-kurangnya 8 aksara.');return}
      if(pw!==$('a-pass2').value){note('Kata laluan tidak sama.');return}
      if(!$('a-ok').checked){note('Sila tandakan persetujuan dengan Polisi Privasi.');return}
      note('Sedang mendaftar...',true);
      var c=await createUserWithEmailAndPassword(auth,em,pw);
      await updateProfile(c.user,{displayName:un});setWho();try{await sendEmailVerification(c.user)}catch(e){}
    }else if(mode==='forgot'){
      if(!em){note('Isi e-mel.');return}
      try{await sendPasswordResetEmail(auth,em)}catch(e){if(e.code!=='auth/user-not-found')throw e}
      note('Jika e-mel itu berdaftar, pautan tetapan semula telah dihantar. Semak juga folder spam.',true);
    }
  }catch(e){note(emsg(e))}
};

window.doLogout=function(){signOut(auth).catch(function(){})};

var CONTACT='';
function policy(){
  return '<div class="m" style="line-height:1.65">'+
  '<p style="margin-top:0"><b>Data yang dikumpul.</b> Username, e-mel, kata laluan, serta rekod servis, hutang, belanja dan tugasan yang anda masukkan.</p>'+
  '<p><b>Tujuan.</b> Data digunakan hanya untuk menjalankan app ini: log masuk dan menyimpan rekod anda.</p>'+
  '<p><b>Penyimpanan.</b> Data disimpan oleh Google Firebase di pelayan Singapura. Kata laluan disimpan dalam bentuk hash oleh Firebase Authentication, dan tidak boleh dibaca oleh sesiapa.</p>'+
  '<p><b>Akses.</b> Anda sahaja boleh membaca rekod anda melalui app. Pemilik app mempunyai akses teknikal ke pangkalan data dan hanya menggunakannya untuk penyelenggaraan dan sokongan.</p>'+
  '<p><b>Perkongsian.</b> Data anda tidak dijual dan tidak dikongsi dengan pihak lain, selain Google sebagai penyedia perkhidmatan penyimpanan.</p>'+
  '<p><b>Pemadaman.</b> Anda boleh memadam akaun dalam bahagian Akaun. Akaun dan semua rekod anda akan dipadam kekal.</p>'+
  '<p><b>Peranti.</b> Pelayar anda menyimpan sesi log masuk supaya anda tidak perlu log masuk setiap kali.</p>'+
  (CONTACT?'<p><b>Hubungi.</b> '+esc(CONTACT)+'</p>':'')+
  '<p style="margin-bottom:0">Dikemas kini: 11 November 2026.</p></div>';
}
window.doResend=async function(){try{await sendEmailVerification(auth.currentUser);note('E-mel pengesahan dihantar. Semak juga folder spam.',true)}catch(e){note(emsg(e))}};
window.doVerified=async function(){
  var u=auth.currentUser;
  try{
    await u.reload();
    if(!u.emailVerified){note('E-mel belum disahkan. Tekan pautan dalam e-mel dahulu.');return}
    await u.getIdToken(true);window.enterApp(u);
  }catch(e){note(emsg(e))}
};
window.doDelete=async function(b){
  var m=$('x-msg'),pw=$('x-pw').value,u=auth.currentUser;
  function say(t){m.textContent=t;m.className='msg err'}
  if(!pw){say('Masukkan kata laluan.');return}
  if(!b.classList.contains('sure')){
    b.classList.add('sure');b.textContent='Pasti? Tekan sekali lagi untuk padam kekal';
    setTimeout(function(){if(b.isConnected){b.classList.remove('sure');b.textContent='Padam akaun saya'}},5000);return;
  }
  try{
    await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,pw));
    clearTimeout(timer);loaded=false;
    await deleteDoc(dref(u));
    await deleteUser(u);
  }catch(e){loaded=true;b.classList.remove('sure');b.textContent='Padam akaun saya';say(emsg(e))}
};

window.doChangePw=async function(){
  var m=$('acc-msg'),o=$('c-old').value,n=$('c-new').value,u=auth.currentUser;
  function say(t,ok){m.textContent=t;m.className='msg '+(ok?'pos':'err')}
  if(!o||!n){say('Isi kedua-dua kata laluan.');return}
  if(n.length<8){say('Kata laluan baharu mesti sekurang-kurangnya 8 aksara.');return}
  try{
    await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,o));
    await updatePassword(u,n);
    $('c-old').value='';$('c-new').value='';say('Kata laluan berjaya ditukar.',true);
  }catch(e){say(emsg(e))}
};

window.vAccount=function(){
  var u=auth.currentUser;
  return '<h2>Akaun</h2><div class="panel"><div class="m" style="margin-bottom:10px">Username: <b>'+esc(u.displayName||'-')+'</b><br>E-mel: '+esc(u.email)+'</div>'+
    '<div class="grid"><div><label for="c-old">Kata laluan lama</label><input id="c-old" type="password" autocomplete="current-password"></div>'+
    '<div><label for="c-new">Kata laluan baharu</label><input id="c-new" type="password" autocomplete="new-password"></div></div>'+
    '<button class="primary" onclick="doChangePw()">Tukar kata laluan</button><div id="acc-msg" class="msg" role="status"></div>'+
    '<button class="ghost" style="margin-top:12px;width:100%" onclick="doLogout()">Log keluar</button></div>'+
    '<h2>Padam akaun</h2><div class="panel"><div class="m" style="margin-bottom:10px">Akaun dan semua rekod anda akan dipadam kekal dan tidak boleh dipulihkan. Muat turun CSV dahulu jika perlu.</div><label for="x-pw">Kata laluan</label><input id="x-pw" type="password" autocomplete="current-password"><button class="ghost" style="margin-top:12px;width:100%" onclick="doDelete(this)">Padam akaun saya</button><div id="x-msg" class="msg" role="status"></div></div>'+
    '<h2>Polisi Privasi</h2><div class="panel">'+policy()+'</div>';
};

window.cloudSave=function(S){
  var u=auth.currentUser;if(!u||!loaded)return;
  clearTimeout(timer);setSync('Menyimpan...');
  timer=setTimeout(function(){
    var d={updated:Date.now()};KEYS.forEach(function(k){d[k]=S[k]});
    setDoc(dref(u),d).then(function(){setSync('Disimpan')},function(){setSync('Gagal simpan. Semak internet.',true)});
  },400);
};

window.enterApp=function(u){
  loaded=false;
  if(!u.emailVerified){showAuth('verify');return}
  showApp(false);$('auth').hidden=false;$('auth').innerHTML='<div class="empty">Memuatkan data...</div>';
  getDoc(dref(u)).then(function(s){
    var d=s.exists()?s.data():null,n={service:[],debt:[],spend:[],todo:[],motors:[]};
    if(d){KEYS.forEach(function(k){if(Array.isArray(d[k]))n[k]=d[k]})}
    else{try{var raw=localStorage.getItem('buku-saya-v1');if(raw){var o=JSON.parse(raw);KEYS.forEach(function(k){if(Array.isArray(o[k]))n[k]=o[k]})}}catch(e){}}
    window.S=n;window.tab='service';loaded=true;var chg=norm();
    showApp(true);setWho();setSync('');render();
    if(!d||chg)cloudSave(window.S);
  }).catch(function(){showAuth('error')});
};
onAuthStateChanged(auth,function(u){
  if(!u){loaded=false;window.S={service:[],debt:[],spend:[],todo:[],motors:[]};showAuth('login');return}
  window.enterApp(u);
});
</script>
